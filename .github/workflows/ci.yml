name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test, Build & Package Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification checks
        run: bun run check

  consumer-smoke:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack the packages and verify a consumer app
        run: bun run smoke

  # Exercises every package's release path without publishing or tagging: it
  # computes (or reports nothing for) the version, applies it, asserts the packed
  # manifest carries no workspace: range in dependencies or peers, and packs the
  # tarball. Path-independent on purpose: an unrelated pull request still proves
  # the reusable workflow works for every package.
  release-dry-run:
    name: Release dry run (${{ matrix.package }})
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            folder: packages/core
            tag-prefix: core-v
          - package: theme
            folder: packages/theme
            tag-prefix: theme-v
          - package: svelte
            folder: packages/svelte
            tag-prefix: svelte-v
    uses: ./.github/workflows/release-package.yml
    with:
      package-folder: ${{ matrix.folder }}
      tag-prefix: ${{ matrix.tag-prefix }}
      dry-run: true
