name: Tooling drift

# Weekly check that this repository's @trajectonomics/tooling pin and its Biome
# config have not drifted from the published package. The caller owns the
# schedule: a reusable workflow's own schedule does not fire for the
# repositories that call it.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    uses: trajectonomics/cicd/.github/workflows/drift.yml@v1
